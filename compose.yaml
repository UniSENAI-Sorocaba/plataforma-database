services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plataforma
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - database-data:/var/lib/postgresql/data

volumes:
  database-data:
